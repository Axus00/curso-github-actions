name: Triggers
run-name: ¡Estoy aprendiendo a usar diferentes Triggers!
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["main", "master"]
  issues:
    types:
      - labeled
  workflow_dispatch:
    inputs:
      lenguaje_favorito:
        description: 'Lenguaje favorito'
        default: sh
        required: false
        type: choice
        options:
        - Python
        - JavaScript
        - Go
        - C#
      nombre:
        description: 'Fernando'
        required: false
        default: Juan
        type: string
jobs:
  hola-mundo:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        
      - name: Correr script hola mundo
        run: bash .github/script/hola-mundo.sh
      - name: Correr script
        run: python hola_mundo.py
